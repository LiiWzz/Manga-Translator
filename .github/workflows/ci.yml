name: CI
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-core
        working-directory: .
      - run: pip install -e '.[test]'
      - run: pytest -q
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check apps/extension/background.js
      - run: node --check apps/extension/content.js
      - run: node --check apps/extension/reader-content.js
      - run: node --check apps/extension/reader-panel.js
      - run: node apps/extension/test-sidepanel-wiring.cjs
      - run: python -m json.tool apps/extension/manifest.json > /dev/null
