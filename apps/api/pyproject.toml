[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manga-translator-poc"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1","uvicorn>=0.29,<1","pillow>=10,<13","pytesseract>=0.3.10,<1","python-multipart>=0.0.9,<1","httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10","httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
