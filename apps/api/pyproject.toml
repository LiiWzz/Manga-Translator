[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manga-translator-poc"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1","uvicorn>=0.29,<1","pillow>=10,<13","pytesseract>=0.3.10,<1","python-multipart>=0.0.9,<1","httpx>=0.27,<1","numpy>=1.26,<3","PyJWT[crypto]>=2.9,<3","pythainlp>=5,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10","httpx>=0.27,<1"]
desktop = ["PySide6-Essentials>=6.8,<7"]
bundle = ["pyinstaller>=6.20,<7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
