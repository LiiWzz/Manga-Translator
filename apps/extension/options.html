<!doctype html><html><head><meta charset="utf-8"><title>Manga Translator Settings</title>
<style>body{font:15px/1.5 system-ui;max-width:600px;margin:30px auto;padding:16px}
button{padding:10px 14px;margin:8px 5px 8px 0}pre{white-space:pre-wrap}</style></head>
<body><h1>Manga Translator Settings</h1>
<p>Connect ChatGPT using the local gateway. Access and refresh tokens never enter Chrome extension storage.</p>
<button id="connect">Open ChatGPT connection settings</button>
<p><label>One-time pairing code <input id="pair-code" type="password" autocomplete="off"></label><button id="pair">Pair extension</button><button id="unpair">Forget local capability</button></p>
<p><label><input type="checkbox" id="debug"> Show OCR and skipped-region debug boxes</label></p>
<button id="check">Check connection</button>
<pre id="status" role="status">Checking connection...</pre>
<script src="options.js"></script></body></html>
