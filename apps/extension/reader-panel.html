<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manga Thai Reader</title><style>
body{font:14px/1.55 system-ui,sans-serif;margin:0;background:#151820;color:#f4f4f7}header{position:sticky;top:0;background:#202735;padding:12px;z-index:2;box-shadow:0 1px 5px #0008}h1{font-size:17px;margin:0 0 8px}button{background:#405ee0;color:white;border:0;border-radius:7px;padding:8px 10px;cursor:pointer}button:disabled{opacity:.4}#status{font-size:12px;margin:7px 0}#items{padding:10px;display:grid;gap:10px}.item{background:#242938;border-radius:10px;padding:12px;border:1px solid #393d4b}.source{font-size:12px;color:#afb9cc;white-space:pre-wrap}.translation{margin:8px 0;white-space:pre-wrap;font-size:17px}.tools{display:flex;gap:6px;flex-wrap:wrap}textarea{width:100%;box-sizing:border-box;min-height:55px;background:#10131b;color:white;border:1px solid #6d7a9c;border-radius:5px;padding:8px}small{color:#bdc7d8}</style></head><body><header><h1>Manga Thai Reader <small>v0.4</small></h1><div class="tools"><button id="scan">แปลภาพที่เห็น</button><button id="grant" hidden>อนุญาตเว็บไซต์</button><button id="reset">เริ่มใหม่</button><button id="settings">ตั้งค่า</button></div><div id="status" role="status">พร้อมใช้งาน</div></header><main id="items"></main><script src="reader-panel.js"></script></body></html>
