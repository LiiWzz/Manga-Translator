services:
  api:
    build: ./apps/api
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      TRANSLATOR_PROVIDER: ${TRANSLATOR_PROVIDER:-mock}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      MANGA_AUTH_DIR: /home/app/.config/manga-translator
    volumes:
      - manga_auth:/home/app/.config/manga-translator
    restart: unless-stopped
volumes:
  manga_auth:
